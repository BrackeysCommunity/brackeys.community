<!doctype html>
<!--
  The play-frame smoke's play page: the site's own host server
  (src/lib/engine/host-server.ts), signed-out saves
  (src/lib/engine/local-saves.ts), signed-in saves through the save API
  (src/lib/engine/save-store.ts) and the claim of this browser's saves on
  sign-in (src/lib/engine/claim-saves.ts), bundled by the smoke, around a
  release's frame on another origin.

    play-host.html?frame=<url>&release=<id>&game=<id>&project=<id>&sandbox=<tokens>&allow=<list>&session=<path>[&mode=site|own|none][&play=<latest|n>&play-path=<path>&live=<path>[&stream=off]]

  The iframe gets the play page's sandbox and allow lists from the query
  (the smoke passes PlayFrame's). Who is signed in comes from the smoke's
  session at the session path. Signed in with saves in this browser, the page
  keeps the ones the claim ticks, as the Keep your saves dialog does when
  the player accepts it, before the frame loads. The host server is
  listening before the frame loads, and what the host heard, every message
  the frame sent on its channel and every call to its save store is kept on
  window.__playHost for the smoke to read.

  With play, the page reads that version's play payload from the play path
  and plays live levels as the play page does: the host server welcomes the
  frame with the payload's live state, and the site's live client
  (src/lib/engine/live-client.ts) follows the channel's stream, reading the
  live state from the live path. With stream=off the page has no
  EventSource, so the client polls. Every live.state the frame reports,
  every swap the client surfaces and every live read is kept on
  window.__playHost.live.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Play host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      iframe {
        display: block;
        border: 0;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body>
    <iframe id="frame" referrerpolicy="no-referrer" title="Game"></iframe>
    <script type="module">
      import { claimSaves, planClaim } from "../../src/lib/engine/claim-saves.ts";
      import { createHostServer } from "../../src/lib/engine/host-server.ts";
      import { createLiveClient } from "../../src/lib/engine/live-client.ts";
      import { localPlayPrefs, localPlaySaves } from "../../src/lib/engine/local-saves.ts";
      import { siteSaveStore } from "../../src/lib/engine/save-store.ts";

      const query = new URLSearchParams(location.search);
      const need = (name) => {
        const value = query.get(name);
        if (value === null) throw new Error(`play-host.html needs ?${name}=`);
        return value;
      };
      const frame = document.getElementById("frame");
      const projectId = need("project");
      const gameId = need("game");
      const mode = query.get("mode") ?? "site";
      const record = {
        states: [],
        issues: [],
        dropped: 0,
        user: null,
        claim: null,
        frameMessages: [],
        storeCalls: [],
        live: null,
      };
      window.__playHost = record;

      // Every message the frame sends on its channel, beside the host server's own handler.
      const NativeChannel = window.MessageChannel;
      window.MessageChannel = class extends NativeChannel {
        constructor() {
          super();
          this.port1.addEventListener("message", (e) => {
            const type = e.data && typeof e.data.type === "string" ? e.data.type : "?";
            record.frameMessages.push(type);
          });
        }
      };

      const user = await fetch(need("session"), { cache: "no-store" })
        .then((r) => (r.ok ? r.json() : { user: null }))
        .then((body) => body.user)
        .catch(() => null);
      record.user = user;

      const local = localPlaySaves(projectId);
      let store = local;
      if (user) {
        const site = siteSaveStore(projectId);
        const offered = await local.list(gameId);
        if (offered.length > 0) {
          const rows = planClaim(offered, await site.list(gameId), site.limits);
          record.claim = {
            rows: rows.map((r) => ({ slot: r.slot, ticked: r.ticked, collides: r.collides })),
            results: [],
          };
          record.claim.results = await claimSaves(rows, local, site, gameId);
        }
        store = site;
      }

      const recorded = {
        get kind() {
          return store.kind;
        },
        get describe() {
          return store.describe;
        },
        get limits() {
          return store.limits;
        },
      };
      for (const method of ["list", "read", "write", "remove"])
        recorded[method] = (...args) => {
          record.storeCalls.push(method);
          return store[method](...args);
        };

      const playVersion = query.get("play");
      const play =
        playVersion === null
          ? null
          : await fetch(
              `${need("play-path")}?${new URLSearchParams({ project: projectId, version: playVersion })}`,
              { cache: "no-store" },
            ).then((r) =>
              r.ok ? r.json() : Promise.reject(new Error(`play payload: ${r.status}`)),
            );
      const initial = play?.live ?? null;
      if (play) {
        if (query.get("stream") === "off") window.EventSource = undefined;
        record.live = {
          version: play.version,
          channel: play.channel,
          initial,
          client: false,
          stream: typeof EventSource !== "undefined",
          reads: 0,
          states: [],
          swaps: [],
          reports: [],
          releaseMoved: 0,
          removed: 0,
        };
      }

      frame.setAttribute("sandbox", need("sandbox"));
      frame.setAttribute("allow", need("allow"));
      const server = createHostServer({
        iframe: frame,
        release: { id: need("release"), gameId, projectId },
        saves: () => recorded,
        describe: () => store.describe,
        mode,
        live: () => initial,
        prefs: localPlayPrefs(projectId),
        player: () =>
          user ? { signedIn: true, name: user.name } : { signedIn: false, name: null },
        onState: (s) => {
          record.states.push(s.jamsState);
          if (s.issue) record.issues.push(s.issue.message);
        },
      });
      Object.defineProperty(record, "dropped", { get: () => server.dropped });

      // As PlayFrame: only a moving name carries live scenes, and only over the release this frame runs.
      if (record.live && initial && initial.release === need("release")) {
        const live = record.live;
        server.onLiveState((state) => live.states.push({ ...state, at: Date.now() }));
        createLiveClient({
          projectId,
          channel: initial.channel,
          initial,
          host: server,
          onSwapApplied: (swap) => live.swaps.push({ ...swap, at: Date.now() }),
          onReleaseMoved: () => live.releaseMoved++,
          onRemoved: () => live.removed++,
          procedures: {
            live: async (input) => {
              live.reads++;
              const r = await fetch(
                `${need("live")}?${new URLSearchParams({ project: input.projectId, channel: input.channel })}`,
                {
                  cache: "no-store",
                },
              );
              if (!r.ok) throw new Error(`live state: ${r.status}`);
              return r.json();
            },
            report: async (input) => {
              live.reports.push(input);
            },
          },
        });
        live.client = true;
      }
      frame.src = need("frame");
    </script>
  </body>
</html>
