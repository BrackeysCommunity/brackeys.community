<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>engine editor</title>
    <style>
      html,
      body,
      #editor {
        height: 100%;
        margin: 0;
      }
      body {
        background: #0b0b10;
        color-scheme: dark;
      }
      .boot {
        display: grid;
        place-items: center;
        height: 100%;
        color: #a1a1aa;
        font:
          13px/1.4 system-ui,
          sans-serif;
      }
      .boot[data-failed] {
        color: #f87171;
        white-space: pre-wrap;
        padding: 0 16px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div id="editor">
      <p class="boot" role="status" aria-live="polite">Loading the editor…</p>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
