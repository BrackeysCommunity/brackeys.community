pipeline-status:
  stage: check
  image: alpine:latest
  script:
    - echo "Starting pipeline run"
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'

lint:
  stage: check
  image: oven/bun:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - bun install --frozen-lockfile
  variables:
    RUST_BACKTRACE: "full"
  retry:
    max: 2
    when: script_failure
  script:
    - bun run lint
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - public/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_TITLE !~ /^Merge branch/
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - public/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"
    # Deliberately no tag clause: a release tag always points at a commit that
    # already ran this job on `main` (auto-tag sits in the `release` stage, so
    # it only fires once check/test/sonar have passed). Re-running it on the
    # tag would re-prove the same commit. release-gate carries the checks that
    # are actually release-specific.

# The root preload graph is what every visitor downloads before anything is
# interactive, and it has grown twice now between the passes that measured
# it (plan 15, then plan 40 §4). Nothing else in the pipeline builds, so
# this job is the only place the manifest exists to be checked.
preload-budget:
  stage: check
  image: oven/bun:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - bun install --frozen-lockfile
  script:
    # The same build also reports each chunk's modules for the engine bundle check.
    - ENGINE_BUNDLE_REPORT=.engine-bundle bun run build
    - bun scripts/measure-preload-graph.ts --check
    - bun scripts/engine-bundle-check.ts --report .engine-bundle
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - src/**/*
        - packages/**/*
        - scripts/measure-preload-graph.ts
        - scripts/engine-bundle-*.ts
        - package.json
        - bun.lock
        - vite.config.*
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - src/**/*
        - packages/**/*
        - scripts/measure-preload-graph.ts
        - scripts/engine-bundle-*.ts
        - package.json
        - bun.lock
        - vite.config.*
    # No tag clause — see the note on `lint` above.

test:
  stage: test
  # Matches the Node the repo is developed on (vp env: 24 LTS). Node 22's
  # structuredClone turns a File into a plain Blob, which browsers don't,
  # so the canvas-io worker tests only fail there.
  image: node:24
  before_script:
    - npm i -g bun
    - bun install --frozen-lockfile
  script:
    - npm run test -- --coverage
  coverage: '/All files[^\|]*\|[^\|]*\s+([\d\.]+)/'
  artifacts:
    paths:
      - coverage/
    expire_in: 1 week
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - public/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - public/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"
    # No tag clause — see the note on `lint` above.

# canvas-sync's own suites, integration included: the root `test` job never
# runs them, and without a database most of them skip. With
# CANVAS_SYNC_REQUIRE_INTEGRATION=1 a suite that would skip fails instead, so
# a missing service or URL can't pass as green.
canvas-sync-test:
  stage: test
  image: oven/bun:latest
  services:
    - name: postgres:16
      alias: postgres
      # Several server instances per suite, each with its own pool.
      command: ["postgres", "-c", "max_connections=200"]
    - name: redis:7
      alias: redis
  variables:
    POSTGRES_DB: canvas_sync_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_HOST_AUTH_METHOD: trust
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/canvas_sync_test
    CANVAS_SYNC_TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/canvas_sync_test
    CANVAS_SYNC_TEST_REDIS_URL: redis://redis:6379
    CANVAS_SYNC_REQUIRE_INTEGRATION: "1"
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    # The root install: drizzle-kit for the migrations, and the packages the
    # shared src/ files the service imports resolve from the repo root.
    - bun install --frozen-lockfile
    - (cd services/canvas-sync && bun install --frozen-lockfile)
    - bun run db:migrate
  script:
    - cd services/canvas-sync
    - bun run typecheck
    - bun test
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - src/**/*
        - packages/**/*
        - services/canvas-sync/**/*
        - drizzle/**/*
        - package.json
        - bun.lock
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - src/**/*
        - packages/**/*
        - services/canvas-sync/**/*
        - drizzle/**/*
        - package.json
        - bun.lock
    # No tag clause — see the note on `lint` above.

# The engine package as an outside consumer gets it: publint, attw and the
# unused-peer check on the packed tarball, then the smoke test (the tarball
# installed outside the repo, `dist/headless` under Bun with `-compat`, and a
# jsdom host on `dist`), and the API report of the packed `.d.mts` files
# against `packages/engine/__tests__/api-report.txt`, and the API reference
# (`packages/engine/docs/api/*.md`) against the same types. The root `test` job
# only ever sees the source.
engine-package:
  stage: test
  # Node for `vp test` in the smoke test's jsdom consumer, as in `test`.
  image: node:24
  before_script:
    - npm i -g bun
    - bun install --frozen-lockfile
  script:
    - bun run engine:typecheck:strict
    - bun run engine:pack:check
    - bun scripts/engine-api-report.ts --check
    - bun scripts/engine-api-docs.ts --check
    - bun run engine:smoke
    # The determinism probe's digests on this image; `test` checks them against
    # the pinned ones under Node, and this artifact keeps Bun's for the record.
    - bun packages/engine/__tests__/probes/determinism-probe.ts | tee determinism-probe.json
  artifacts:
    paths:
      - determinism-probe.json
    expire_in: 1 month
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - packages/engine/**/*
        - scripts/engine-smoke/**/*
        - scripts/engine-api/**/*
        - scripts/engine-api-docs.ts
        - scripts/engine-api-report.ts
        - package.json
        - bun.lock
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - packages/engine/**/*
        - scripts/engine-smoke/**/*
        - scripts/engine-api/**/*
        - scripts/engine-api-docs.ts
        - scripts/engine-api-report.ts
        - package.json
        - bun.lock
    # No tag clause — see the note on `lint` above; `engine-pack` runs both on an engine tag.

# The checks no other job runs: formatting, lint and types over the whole repo,
# each service's own typecheck against its own dependencies, and the scene
# CLI's validation of every engine and game scene.
engine-verify:
  stage: test
  image: node:24
  before_script:
    - npm i -g bun
    - bun install --frozen-lockfile
  script:
    - ./node_modules/.bin/vp check
    - |
      for dir in services/*/; do
        if [ -f "$dir/tsconfig.json" ] && grep -q '"typecheck"' "$dir/package.json"; then
          echo "== $dir"
          (cd "$dir" && bun install --frozen-lockfile && bun run typecheck) || exit 1
        fi
      done
    - |
      scenes=$(bun scripts/scene/cli.ts list --json) || exit 1
      targets=$(printf '%s' "$scenes" | bun -e 'const d = JSON.parse(await Bun.stdin.text()); for (const s of d.scenes ?? []) console.log(`${s.home} ${s.name}`)') || exit 1
      [ -n "$targets" ] || { echo "scene list found no scenes" >&2; exit 1; }
      printf '%s\n' "$targets" | while read -r home name; do
        bun scripts/scene/cli.ts validate --project "$home" "$name" || exit 1
      done || exit 1
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - src/**/*
        - packages/**/*
        - services/**/*
        - scripts/**/*
        - package.json
        - bun.lock
        - tsconfig*.json
        - vite.config.*
        - "*.config.*"

engine-browser-smoke:
  stage: test
  # The tag must match the exact `playwright` devDependency, whose browser
  # builds this image ships, so the job downloads none.
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  before_script:
    - npm i -g bun
    - bun install --frozen-lockfile
  script:
    - bun scripts/engine-smoke/browser.ts --browsers chromium,firefox,webkit
  artifacts:
    when: always
    paths:
      - engine-browser-smoke.json
    expire_in: 1 month
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - packages/engine/**/*
        - scripts/engine-smoke/**/*
        - package.json
        - bun.lock
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - packages/engine/**/*
        - scripts/engine-smoke/**/*
        - package.json
        - bun.lock

engine-export-smoke:
  stage: test
  image: mcr.microsoft.com/playwright:v1.64.1-noble
  timeout: 45 minutes
  before_script:
    - npm i -g bun
    - bun install --frozen-lockfile
  script:
    - bun scripts/engine-smoke/export.ts --browsers chromium,firefox,webkit
  artifacts:
    when: always
    paths:
      - engine-export-smoke.json
    expire_in: 1 month
  rules:
    - !reference [.skip-version-bump, rules]
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes:
        - packages/engine/**/*
        - src/games/**/*
        - scripts/engine-smoke/**/*
        - scripts/engine-bundle-check.ts
        - scripts/engine-bundle-report.ts
        - scripts/scene/**/*
        - vite.config.ts
        - package.json
        - bun.lock
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - packages/engine/**/*
        - src/games/**/*
        - scripts/engine-smoke/**/*
        - scripts/engine-bundle-check.ts
        - scripts/engine-bundle-report.ts
        - scripts/scene/**/*
        - vite.config.ts
        - package.json
        - bun.lock
