# Apply Drizzle migrations to staging (on `main`, when files under drizzle/
# change) and to prod (on every `vX.Y.Z` release tag, always).
# `drizzle-kit migrate` (v1) scans the timestamped migration
# folders under drizzle/, compares folder names against rows recorded in
# drizzle.__drizzle_migrations on the target DB, and applies every migration
# not yet recorded there. See drizzle/README.md for the one-time re-baseline
# each existing DB needs before its first v1 run.

.db-migrate:
  stage: db-migrate
  image: oven/bun:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - bun install --frozen-lockfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

db-migrate-staging:
  extends: .db-migrate
  variables:
    DATABASE_URL: $STAGING_DATABASE_URL
  script:
    - bun run db:migrate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - drizzle/**/*

# Prod migrates on a release tag, before any container is replaced — see
# .gitlab/release.gitlab-ci.yml. Deliberately has no `changes:` filter: the
# migrator is a no-op when nothing is pending, and filtering is what let the
# schema and the code race under the old `prod`-branch trigger. A failure here
# stops the release with prod still whole, since drizzle applies pending
# migrations in one transaction.
db-migrate-prod:
  extends: .db-migrate
  # Only release-gate: lint/test do not run on a tag pipeline, because the
  # tag's commit already passed them on `main` before auto-tag cut the tag.
  needs:
    - job: release-gate
      artifacts: false
  resource_group: prod-release-db
  interruptible: false
  variables:
    DATABASE_URL: $PROD_DATABASE_URL
  script:
    # An empty DATABASE_URL reaches drizzle-kit as `url: ''` and fails with a
    # message that says nothing about why. The usual cause is variable
    # exposure, not a missing variable.
    - |
      if [ -z "${DATABASE_URL:-}" ]; then
        echo "✗ PROD_DATABASE_URL is empty on this pipeline — prod was NOT migrated."
        echo "  Ref: ${CI_COMMIT_TAG:-$CI_COMMIT_REF_NAME}"
        echo "  Most likely one of:"
        echo "   1. The variable is 'Protected' but this tag is not. Add a protected-tag"
        echo "      rule for 'v*' (Settings → Repository → Protected tags, Maintainers)."
        echo "   2. The variable is scoped to an environment. This job declares none,"
        echo "      so an environment-scoped variable never reaches it — scope it to '*'."
        echo "   3. It is genuinely unset, or the name is misspelled."
        exit 1
      fi
    - bun run db:migrate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
