# Apply Drizzle migrations to staging (on `main`, when files under drizzle/
# change) and to prod (on every `vX.Y.Z` release tag, always).
# `drizzle-kit migrate` (v1) scans the timestamped migration
# folders under drizzle/, compares folder names against rows recorded in
# drizzle.__drizzle_migrations on the target DB, and applies every migration
# not yet recorded there. See drizzle/README.md for the one-time re-baseline
# each existing DB needs before its first v1 run.

.db-migrate:
  stage: db-migrate
  image: oven/bun:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq git
    - bun install --frozen-lockfile
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never

db-migrate-staging:
  extends: .db-migrate
  variables:
    DATABASE_URL: $STAGING_DATABASE_URL
  script:
    - bun run db:migrate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == 'main'
      changes:
        - drizzle/**/*

# Prod migrates on a release tag, before any container is replaced — see
# .gitlab/release.gitlab-ci.yml. Deliberately has no `changes:` filter: the
# migrator is a no-op when nothing is pending, and filtering is what let the
# schema and the code race under the old `prod`-branch trigger. A failure here
# stops the release with prod still whole, since drizzle applies pending
# migrations in one transaction.
db-migrate-prod:
  extends: .db-migrate
  # The full gate, not just release-gate: `needs` runs a job as soon as its
  # dependencies finish, so listing only the gate would let a migration land on
  # prod while the test suite was still running.
  needs:
    - job: release-gate
      artifacts: false
    - job: lint
      artifacts: false
    - job: test
      artifacts: false
  resource_group: prod-release-db
  interruptible: false
  variables:
    DATABASE_URL: $PROD_DATABASE_URL
  script:
    - bun run db:migrate
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/
