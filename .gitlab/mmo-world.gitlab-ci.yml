# The MMO's Go core (services/mmo-world). Vite+ does not wrap Go, so these
# jobs are its own. They run only when the module changes, so a site-only
# change builds no Go.

.mmo-world-go:
  image: golang:1.27
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
      changes: &mmo-world-changes
        - services/mmo-world/**/*
        - packages/mmo-api/**/*
        - drizzle/*mmo*/**/*
        - src/db/mmo.ts
        - .gitlab/mmo-world.gitlab-ci.yml
    - if: $CI_COMMIT_BRANCH == 'main' && $CI_COMMIT_TITLE !~ /^Merge branch/
      changes: *mmo-world-changes
  variables:
    # go.mod's toolchain line decides the exact version.
    GOTOOLCHAIN: auto
    GOPATH: $CI_PROJECT_DIR/.go
    GOLANGCI_LINT_VERSION: v2.15.0
    SQLC_VERSION: v1.30.0
    TYGO_VERSION: v0.2.18
  cache:
    key: mmo-world-go
    paths:
      - .go/pkg/mod
  before_script:
    - cd services/mmo-world
    - go mod download

# gofmt, vet, simlint and golangci-lint.
mmo-world-lint:
  extends: .mmo-world-go
  stage: check
  script:
    - test -z "$(gofmt -l . | grep -v '^lint/testdata/')" || (gofmt -l . && exit 1)
    - go vet ./...
    - go run ./cmd/simlint ./...
    - go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}
    - $GOPATH/bin/golangci-lint run ./...

# -race outside sim/, which has no goroutines. Database tests use the job's
# Postgres; the nightly replay test needs pg_dump and psql.
mmo-world-test:
  extends: .mmo-world-go
  stage: test
  services:
    - name: postgres:16
      alias: postgres
  variables:
    POSTGRES_HOST_AUTH_METHOD: trust
    MMO_TEST_DATABASE_URL: postgres://postgres@postgres:5432/postgres?sslmode=disable
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null
    - go test ./sim/...
    - go test -race $(go list ./... | grep -v '^jams.team/mmo-world/sim\(/\|$\)')

# The harness Check run (see harness/check.go); mmo-world-lint owns the
# sim analyzers. report -check fails while the newest file under
# harness/epochs holds readings of another book: no sheet change ships
# without its Report (GDD 18.1 rule 4).
mmo-world-sheet-check:
  extends: .mmo-world-go
  stage: check
  script:
    - go run ./cmd/harness check -skip-lint
    - go run ./cmd/harness report -check

# The generated code is current: sqlc's queries against the drizzle
# migrations, and packages/mmo-api against api/.
mmo-world-generated:
  extends: .mmo-world-go
  stage: check
  script:
    - go install github.com/sqlc-dev/sqlc/cmd/sqlc@${SQLC_VERSION}
    - go install github.com/gzuidhof/tygo@${TYGO_VERSION}
    - $GOPATH/bin/sqlc diff
    - $GOPATH/bin/tygo generate
    - git diff --exit-code -- ../../packages/mmo-api
