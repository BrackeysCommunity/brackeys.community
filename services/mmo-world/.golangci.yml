# General Go hygiene. The sim's own rules and the exhaustiveness checks run
# in cmd/simlint, scoped to this module's types.
version: "2"
run:
  tests: true
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - unconvert
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintln
        - fmt.Fprintf
        - fmt.Fprint
  exclusions:
    paths:
      - lint/testdata
formatters:
  enable: [gofmt]
