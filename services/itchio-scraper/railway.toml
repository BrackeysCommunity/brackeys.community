# DEPRECATED — the pre-split combined cron service.
#
# The scrape now runs as three independent cron services with different
# cadences: railway.live.toml (:00 hourly), railway.discovery.toml (:20
# hourly), railway.results.toml (:40 six-hourly).
#
# This config is kept only so the existing service keeps working until it is
# retired. `bun run start` now runs all three tiers back to back in one process
# (src/index.ts), which is correct but puts everything back on one schedule —
# exactly the coupling the split removed.
#
# To retire it: stand up the three new services, watch one tick of each, then
# delete this service along with railway.toml, src/index.ts, and
# src/index.test.ts. See the README's "Migrating from the single pre-split
# service".

[build]
builder = "DOCKERFILE"
dockerfilePath = "services/itchio-scraper/Dockerfile"

[deploy]
startCommand = "bun run start"
cronSchedule = "0 0 * * *"
restartPolicyType = "NEVER"
